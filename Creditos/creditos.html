<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súper Marian - Créditos</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f4f6f8;color:#263238}
header{background:#d35400;color:#fff;padding:18px 24px;font-size:23px;font-weight:bold;box-shadow:0 3px 10px #0002}
.container{max-width:1250px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:330px 1fr;gap:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 5px 18px #00000012}.card h2{margin-top:0;color:#b94700;border-bottom:2px solid #eee;padding-bottom:10px}
label{display:block;margin-top:10px;font-size:13px;font-weight:600;color:#555}input,select{width:100%;padding:11px;margin-top:5px;border:1px solid #ccd3d8;border-radius:7px;box-sizing:border-box;font-size:15px}
button{padding:10px 14px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}.btn-main{background:#d35400;color:#fff;width:100%;margin-top:15px}.btn-abono{background:#27ae60;color:#fff}.btn-volver{background:#666;color:#fff;margin-bottom:18px}
.consulta{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.consulta button{background:#1a73e8;color:#fff}.estado{color:#666;min-height:20px;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}th{background:#fafafa}.badge{padding:4px 7px;border-radius:5px;background:#e8f0fe;color:#1a73e8;font-family:monospace;font-weight:bold}.pendiente{color:#d35400;font-weight:bold}.vencido{color:#c0392b;font-weight:bold}.pagado{color:#27ae60;font-weight:bold}
.table-wrap{overflow:auto}.resumen{display:flex;gap:25px;margin-bottom:15px;flex-wrap:wrap}.resumen strong{display:block;font-size:20px;color:#d35400}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}.modal-content{background:#fff;border-radius:12px;padding:22px;width:min(600px,100%);box-sizing:border-box}.modal-content h2{margin-top:0;color:#b94700}
@media(max-width:850px){.grid{grid-template-columns:1fr}.consulta{grid-template-columns:1fr}header{font-size:19px}}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>📓 Créditos y cuentas por cobrar</header>
<div class="container">
<button class="btn-volver" onclick="location.href='../menu.html'">⬅ Volver al menú</button>
<div class="grid">
<section class="card" id="nuevoClienteCard">
<h2>Nuevo cliente</h2>
<label>Nombre completo *<input id="nomCliente" type="text" autocomplete="name"></label>
<label>Teléfono *<input id="telCliente" type="tel" maxlength="12" inputmode="numeric" placeholder="809-000-0000" autocomplete="tel"></label>
<label>Dirección<input id="dirCliente" type="text" autocomplete="street-address"></label>
<label>Cédula<input id="cedCliente" type="text" maxlength="13" inputmode="numeric" placeholder="000-0000000-0"></label>
<label>RNC<input id="rncCliente" type="text" maxlength="9" inputmode="numeric" placeholder="000000000"></label>
<label>Foto frontal de cédula<input id="cedulaFrontal" type="file" accept="image/*" capture="environment"></label>
<label>Foto posterior de cédula<input id="cedulaPosterior" type="file" accept="image/*" capture="environment"></label>
<p id="estadoCedula" class="estado">Las fotos son opcionales. Verifica los datos antes de guardar.</p>
<div id="previewsCedula" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
<label>Límite de crédito RD$<input id="limiteCliente" type="number" min="0" step="0.01" value="0"></label>
<button class="btn-main" onclick="crearCliente()">Registrar cliente</button>
<p id="estadoCliente" class="estado"></p>
</section>
<section class="card">
<h2>Consulta de créditos</h2>
<div class="resumen"><div>Saldo pendiente<strong id="totalPendiente">RD$ 0</strong></div><div>Vencidos<strong id="totalVencidos">0</strong></div></div>
<div class="consulta"><input id="busquedaCredito" type="search" placeholder="Cliente, teléfono, crédito o factura..." autocomplete="off"><button onclick="ejecutarBusqueda()">Consultar</button></div>
<p id="estadoConsulta" class="estado">Escribe y presiona Enter para consultar.</p>
<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Crédito</th><th>Factura</th><th>Saldo</th><th>Vencimiento</th><th>Acción</th></tr></thead><tbody id="listaCreditos"></tbody></table></div>
</section>
</div>
</div>
<div id="modalAbono" class="modal"><div class="modal-content">
<h2>Registrar abono</h2><p id="detalleAbono"></p>
<label>Monto a abonar<input id="montoAbono" type="number" min="0.01" step="0.01"></label>
<label>Observación<input id="observacionAbono" type="text"></label>
<div style="display:flex;gap:8px;margin-top:15px"><button class="btn-abono" onclick="guardarAbono()">Guardar abono</button><button onclick="cerrarModal()">Cancelar</button></div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAy4En1r4frGng-tWFtA68FGLf0vupJ0AY",authDomain:"supermercado-marian.firebaseapp.com",projectId:"supermercado-marian"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const auth=firebase.auth();
let clientes=[],creditos=[],creditoSeleccionado=null,busquedaActiva=false,rolActual='';
let fotosCedula={frontal:null,posterior:null};
const escapar=valor=>String(valor??'').replace(/[&<>"']/g,caracter=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[caracter]));
const fechaComoDate=valor=>{if(!valor)return null;if(typeof valor.toDate==='function')return valor.toDate();const fecha=new Date(valor);return Number.isNaN(fecha.getTime())?null:fecha};
const dinero=valor=>`RD$ ${Number(valor||0).toLocaleString('es-DO',{minimumFractionDigits:2})}`;

async function cargarDatos(){
    const [clientesSnapshot, creditosSnapshot, legadosSnapshot]=await Promise.all([
        db.collection('clientes').get(),
        db.collection('deudas_clientes').get(),
        db.collection('clientes_fiado').get()
    ]);
    clientes=clientesSnapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    creditos=creditosSnapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    const creditosLegados=legadosSnapshot.docs.map(doc=>({id:doc.id,legacy:true,nombreCliente:doc.data().nombre,clienteDatos:doc.data(),saldoPendiente:Number(doc.data().deuda||0),montoOriginal:Number(doc.data().deuda||0),estado:Number(doc.data().deuda||0)>0?'PENDIENTE':'PAGADO',...doc.data()}));
    creditos=[...creditos,...creditosLegados];
}

auth.onAuthStateChanged(async user=>{
    if(!user)return window.location.href='../index.html';
    const token=await user.getIdTokenResult();
    rolActual=token.claims.rol||'';
    if(!rolActual){
        const usuarioSnapshot=await db.collection('usuarios').where('email','==',user.email.toLowerCase()).limit(1).get();
        if(!usuarioSnapshot.empty)rolActual=usuarioSnapshot.docs[0].data().rol||'';
    }
    if(!['Administrador','Jefe'].includes(rolActual))document.getElementById('nuevoClienteCard').style.display='none';
    try{await cargarDatos();busquedaActiva=true;renderizarCreditos()}catch(error){console.error(error);document.getElementById('estadoConsulta').innerText='No se pudieron cargar los créditos. Revisa las reglas de Firebase.'}
});

async function crearCliente(){
    if(!['Administrador','Jefe'].includes(rolActual))return alert('Solo Administrador o Jefe puede registrar clientes.');
    const nombre=document.getElementById('nomCliente').value.trim(),telefono=document.getElementById('telCliente').value.trim();
    const direccion=document.getElementById('dirCliente').value.trim(),cedula=document.getElementById('cedCliente').value.trim(),rnc=document.getElementById('rncCliente').value.trim();
    const limite=Number(document.getElementById('limiteCliente').value)||0;
    if(!nombre||!telefono)return alert('Nombre y teléfono son obligatorios.');
    if(!/^(809|829|849)-\d{7}$/.test(telefono))return alert('El teléfono debe tener el formato 809-000-0000, 829-000-0000 o 849-000-0000.');
    if(cedula&&!/^\d{3}-\d{7}-\d$/.test(cedula))return alert('La cédula debe tener el formato 000-0000000-0.');
    if(rnc&&!/^\d{9}$/.test(rnc))return alert('El RNC debe contener exactamente 9 números.');
    if(!clientes.length)await cargarDatos();
    if(clientes.some(cliente=>cliente.telefono===telefono||(cedula&&cliente.cedula===cedula)||(rnc&&cliente.rnc===rnc)))return alert('Ya existe un cliente con ese teléfono, cédula o RNC.');
    const clienteRef=db.collection('clientes').doc();
    clienteRef.set({idCliente:clienteRef.id,nombre,telefono,direccion,cedula,rnc,limiteCredito:limite,permiteCredito:true,fotoCedulaFrontal:fotosCedula.frontal,fotoCedulaPosterior:fotosCedula.posterior,fechaRegistro:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
        document.querySelectorAll('#nomCliente,#telCliente,#dirCliente,#cedCliente,#rncCliente,#cedulaFrontal,#cedulaPosterior').forEach(input=>input.value='');document.getElementById('limiteCliente').value='0';fotosCedula={frontal:null,posterior:null};document.getElementById('previewsCedula').innerHTML='';document.getElementById('estadoCliente').innerText=`Cliente guardado correctamente. ID: ${clienteRef.id}`;
    }).catch(error=>{console.error(error);alert('No se pudo guardar el cliente.');});
}

function formatearTelefono(valor){const digitos=valor.replace(/\D/g,'').slice(0,10);return digitos.length>3?`${digitos.slice(0,3)}-${digitos.slice(3)}`:digitos}
function formatearCedula(valor){const digitos=valor.replace(/\D/g,'').slice(0,11);if(digitos.length<=3)return digitos;if(digitos.length<=10)return `${digitos.slice(0,3)}-${digitos.slice(3)}`;return `${digitos.slice(0,3)}-${digitos.slice(3,10)}-${digitos.slice(10)}`}
function comprimirFoto(archivo){return new Promise((resolve,reject)=>{const lector=new FileReader();lector.onload=()=>{const imagen=new Image();imagen.onload=()=>{const max=1400,escala=Math.min(1,max/Math.max(imagen.width,imagen.height)),canvas=document.createElement('canvas');canvas.width=Math.round(imagen.width*escala);canvas.height=Math.round(imagen.height*escala);canvas.getContext('2d').drawImage(imagen,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.62))};imagen.onerror=reject;imagen.src=lector.result};lector.onerror=reject;lector.readAsDataURL(archivo)})}
async function procesarFotoCedula(evento,lado){const archivo=evento.target.files[0];if(!archivo)return;try{fotosCedula[lado]=await comprimirFoto(archivo);document.getElementById('previewsCedula').innerHTML=Object.entries(fotosCedula).filter(([,foto])=>foto).map(([nombre,foto])=>`<div><small>${nombre==='frontal'?'Frontal':'Posterior'}</small><img src="${foto}" alt="Cédula ${nombre}" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px"></div>`).join('');document.getElementById('estadoCedula').innerText='Procesando texto de la cédula...';if(window.Tesseract){const resultado=await Tesseract.recognize(fotosCedula[lado],'spa');const encontrada=resultado.data.text.match(/\b\d{3}[- ]?\d{7}[- ]?\d\b/);if(encontrada&&!document.getElementById('cedCliente').value)document.getElementById('cedCliente').value=formatearCedula(encontrada[0]);}document.getElementById('estadoCedula').innerText='Foto cargada. Confirma o corrige los datos antes de guardar.'}catch(error){console.error(error);document.getElementById('estadoCedula').innerText='No se pudo leer la foto. Puedes escribir los datos manualmente.'}}
document.getElementById('telCliente').addEventListener('input',event=>event.target.value=formatearTelefono(event.target.value));
document.getElementById('cedCliente').addEventListener('input',event=>event.target.value=formatearCedula(event.target.value));
document.getElementById('rncCliente').addEventListener('input',event=>event.target.value=event.target.value.replace(/\D/g,'').slice(0,9));
document.getElementById('cedulaFrontal').addEventListener('change',event=>procesarFotoCedula(event,'frontal'));
document.getElementById('cedulaPosterior').addEventListener('change',event=>procesarFotoCedula(event,'posterior'));

async function ejecutarBusqueda(){
    const estado=document.getElementById('estadoConsulta');
    estado.innerText='Consultando Firebase...';
    try{await cargarDatos();busquedaActiva=true;renderizarCreditos()}catch(error){console.error(error);estado.innerText='No se pudo consultar. Revisa la conexión y los permisos.'}
}
document.getElementById('busquedaCredito').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();ejecutarBusqueda()}});

function renderizarCreditos(){
    if(!busquedaActiva)return;
    const termino=document.getElementById('busquedaCredito').value.trim().toLowerCase();
    const lista=creditos.filter(credito=>{const cliente=clientes.find(item=>item.id===credito.idCliente);const texto=[credito.nroCredito,credito.nroFactura,credito.nombreCliente,cliente?.telefono,cliente?.cedula].join(' ').toLowerCase();return !termino||texto.includes(termino)});
    const ahora=new Date();let saldoTotal=0,vencidos=0;
    lista.forEach(credito=>{saldoTotal+=Number(credito.saldoPendiente??credito.montoDeuda??0);const vencimiento=fechaComoDate(credito.fechaVencimiento);if(credito.estado!=='PAGADO'&&vencimiento&&vencimiento<ahora)vencidos++});
    document.getElementById('totalPendiente').innerText=dinero(saldoTotal);document.getElementById('totalVencidos').innerText=vencidos;document.getElementById('estadoConsulta').innerText=`${lista.length} crédito(s) encontrado(s).`;
    document.getElementById('listaCreditos').innerHTML=lista.map(credito=>{const saldo=Number(credito.saldoPendiente??credito.montoDeuda??0),vencimiento=fechaComoDate(credito.fechaVencimiento);const estaVencido=credito.estado!=='PAGADO'&&vencimiento&&vencimiento<ahora;const estado=credito.estado==='PAGADO'?'pagado':estaVencido?'vencido':'pendiente';const accion=saldo>0&&['Administrador','Jefe'].includes(rolActual)?`<button class="btn-abono" onclick="abrirAbono('${credito.id}')">Abonar</button>`:'<span class="pagado">Solo lectura</span>';return `<tr><td><b>${escapar(credito.nombreCliente||'Sin cliente')}</b></td><td><span class="badge">${escapar(credito.nroCredito||'Sin número')}</span></td><td>${escapar(credito.nroFactura||'S/N')}</td><td class="${estado}">${dinero(saldo)}<br><small>${credito.estado||'PENDIENTE'}</small></td><td class="${estaVencido?'vencido':''}">${vencimiento?vencimiento.toLocaleDateString('es-DO'):'Sin fecha'}</td><td>${accion}</td></tr>`}).join('')||'<tr><td colspan="6">No hay resultados.</td></tr>';
}

function abrirAbono(id){creditoSeleccionado=creditos.find(credito=>credito.id===id);if(!creditoSeleccionado)return;const saldo=Number(creditoSeleccionado.saldoPendiente??creditoSeleccionado.montoDeuda??0);document.getElementById('detalleAbono').innerText=`${creditoSeleccionado.nroCredito||'Crédito'} - ${creditoSeleccionado.nombreCliente||'Cliente'} - Saldo: ${dinero(saldo)}`;document.getElementById('montoAbono').value='';document.getElementById('observacionAbono').value='';document.getElementById('modalAbono').style.display='flex'}
function cerrarModal(){document.getElementById('modalAbono').style.display='none';creditoSeleccionado=null}

async function guardarAbono(){
    if(!['Administrador','Jefe'].includes(rolActual))return alert('Solo Administrador o Jefe puede registrar abonos.');
    if(!creditoSeleccionado)return;const monto=Number(document.getElementById('montoAbono').value);const saldoActual=Number(creditoSeleccionado.saldoPendiente??creditoSeleccionado.montoDeuda??0);if(!Number.isFinite(monto)||monto<=0||monto>saldoActual)return alert('El monto no es válido.');
    const coleccion=creditoSeleccionado.legacy?'clientes_fiado':'deudas_clientes';const deudaRef=db.collection(coleccion).doc(creditoSeleccionado.id);const pagoRef=db.collection('pagos_creditos').doc();const nuevoSaldo=Math.max(0,saldoActual-monto);
    try{await db.runTransaction(async transaction=>{const deuda=await transaction.get(deudaRef);if(!deuda.exists)throw new Error('Crédito no encontrado');const datos=deuda.data();const saldo=Number(datos.saldoPendiente??datos.montoDeuda??datos.deuda??0);if(monto>saldo)throw new Error('El saldo cambió. Consulta nuevamente.');const actualizacion=creditoSeleccionado.legacy?{deuda:Math.max(0,saldo-monto)}:{saldoPendiente:Math.max(0,saldo-monto),estado:saldo-monto<=0?'PAGADO':'PENDIENTE',fechaUltimoAbono:firebase.firestore.FieldValue.serverTimestamp()};transaction.update(deudaRef,actualizacion);transaction.set(pagoRef,{idCredito:creditoSeleccionado.id,nroCredito:creditoSeleccionado.nroCredito||null,nroFactura:creditoSeleccionado.nroFactura||null,idCliente:creditoSeleccionado.idCliente||null,monto,observacion:document.getElementById('observacionAbono').value.trim(),fecha:firebase.firestore.FieldValue.serverTimestamp(),tipo:'ABONO'});});cerrarModal();alert(`Abono registrado. Nuevo saldo: ${dinero(nuevoSaldo)}`);renderizarCreditos()}catch(error){console.error(error);alert(error.message||'No se pudo registrar el abono.')}}
</script>
<script src="../offline-status.js"></script>
</body>
</html>
