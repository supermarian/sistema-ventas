<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Súper Marian - Reportes de Ventas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; }
        header { background: #6f42c1; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .stat-card h3 { margin: 0; color: #666; font-size: 16px; }
        .stat-card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: #6f42c1; }
        .table-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .consulta-barra { display:grid; grid-template-columns:180px 1fr auto; gap:10px; margin-bottom:18px; }
        .consulta-barra input, .consulta-barra select { padding:11px; border:2px solid #d9dee5; border-radius:8px; font-size:1rem; box-sizing:border-box; }
        .consulta-barra input:focus, .consulta-barra select:focus { border-color:#1a73e8; outline:none; }
        .btn-consultar { background:#1a73e8; color:white; border:0; border-radius:8px; padding:11px 18px; font-weight:bold; cursor:pointer; }
        .estado-consulta { color:#666; min-height:22px; }
        @media(max-width:650px){ .consulta-barra { grid-template-columns:1fr; } }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #555; }
        .btn-volver { background: #666; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<header>📈 Reportes de Ventas - Súper Marian</header>

<div class="container">
    <button class="btn-volver" onclick="location.href='menu.html'">⬅ Volver al Menú</button>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Ventas Totales</h3>
            <p id="totalHistorico">RD$ 0</p>
        </div>
        <div class="stat-card">
            <h3>Tickets Emitidos</h3>
            <p id="cantidadVentas">0</p>
        </div>
        <div class="stat-card">
            <h3>Promedio por Venta</h3>
            <p id="promedioVenta">RD$ 0</p>
        </div>
    </div>

    <div class="table-card">
        <h3>🔎 Consultas y reportes</h3>
        <div class="consulta-barra">
            <select id="tipoConsulta" aria-label="Tipo de consulta">
                <option value="ventas">Ventas</option>
                <option value="creditos">Créditos pendientes</option>
                <option value="productos">Productos</option>
                <option value="inventario_inactivo">Productos inactivos</option>
                <option value="inventario_negativo">Stock negativo</option>
                <option value="inventario_bajo">Stock bajo</option>
                <option value="ventas_precio">Ventas posteriores a cambio</option>
                <option value="caja">Movimientos de caja</option>
            </select>
            <input id="textoConsulta" type="search" placeholder="Factura, cliente, crédito o código..." autocomplete="off">
            <button id="btnConsultar" class="btn-consultar" type="button">Consultar</button>
        </div>
        <p id="estadoConsulta" class="estado-consulta">Escribe un filtro y presiona Enter para consultar.</p>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Detalle</th>
                    <th>Monto / Estado</th>
                </tr>
            </thead>
            <tbody id="tablaReportes">
                </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAy4En1r4frGng-tWFtA68FGLf0vupJ0AY",
        authDomain: "supermercado-marian.firebaseapp.com",
        projectId: "supermercado-marian",
        storageBucket: "supermercado-marian.firebasestorage.app",
        messagingSenderId: "627337795444",
        appId: "1:627337795444:web:e9a4cb48ff164b78477e21"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let accesoPermitido = false;

    const convertirFecha = (valor) => {
        if (!valor) return "Sin fecha";
        if (typeof valor.toDate === "function") return valor.toDate().toLocaleString();
        return new Date(valor).toLocaleString();
    };

    const ejecutarConsulta = async () => {
        if (!accesoPermitido) return alert('No tienes permisos para consultar reportes.');
        const tipo = document.getElementById("tipoConsulta").value;
        const termino = document.getElementById("textoConsulta").value.trim().toLowerCase();
        const estado = document.getElementById("estadoConsulta");
        const tabla = document.getElementById('tablaReportes');
        estado.innerText = "Consultando Firebase...";
        tabla.innerHTML = "";

        const coleccion = tipo === "creditos" ? "deudas_clientes" : tipo === "productos" || tipo.startsWith("inventario_") ? "productos" : tipo === "caja" ? "movimientos_caja" : tipo === "ventas_precio" ? "ventas_precio" : "ventas_realizadas";
        try {
            const snapshot = await getDocs(collection(db, coleccion));
            const filas = snapshot.docs.map(documento => ({ id: documento.id, ...documento.data() })).filter(registro => {
                const stock = Number(registro.stock);
                if (tipo === "creditos" && registro.estado !== "PENDIENTE") return false;
                if (tipo === "inventario_inactivo" && registro.estatus !== "INACTIVO") return false;
                if (tipo === "inventario_negativo" && stock >= 0) return false;
                if (tipo === "inventario_bajo" && (stock < 0 || stock > 5)) return false;
                if (!termino) return true;
                return JSON.stringify(registro).toLowerCase().includes(termino);
            });

            filas.sort((a, b) => {
                const fechaA = a.fecha?.toDate?.() || new Date(a.fecha || a.timestamp || 0);
                const fechaB = b.fecha?.toDate?.() || new Date(b.fecha || b.timestamp || 0);
                return fechaB - fechaA;
            });
            let sumaTotal = 0;
            let html = filas.map(registro => {
                const fecha = convertirFecha(registro.fecha || registro.timestamp || registro.fechaVencimiento);
                const detalle = tipo === "ventas"
                    ? `${registro.nroFactura || "S/N"} - ${registro.cliente || "Consumidor Final"}`
                    : tipo === "creditos"
                        ? `${registro.nroCredito || "Sin número"} - ${registro.nombreCliente || "Sin cliente"}`
                        : tipo === "productos" || tipo.startsWith("inventario_")
                            ? `${registro.codigo || "S/C"} - ${registro.nombre || "Sin nombre"}`
                            : tipo === "ventas_precio"
                                ? `${registro.producto || "Producto"} - ${registro.nroFactura || "S/N"} (${registro.idCambio || "Sin cambio"})`
                            : `${registro.tipo || "Movimiento"} - ${registro.motivo || registro.descripcion || "Sin detalle"}`;
                const monto = Number(registro.total ?? registro.montoDeuda ?? registro.precio ?? registro.monto ?? 0);
                sumaTotal += tipo === "ventas" ? monto : 0;
                const estadoRegistro = registro.estado || `RD$ ${monto.toLocaleString()}`;
                return `<tr><td>${fecha}</td><td>${detalle}</td><td><strong>${tipo === "ventas" ? `RD$ ${monto.toLocaleString()}` : estadoRegistro}</strong></td></tr>`;
            }).join("");

            tabla.innerHTML = html || "<tr><td colspan='3'>No se encontraron resultados.</td></tr>";
            document.getElementById('totalHistorico').innerText = tipo === "ventas" ? `RD$ ${sumaTotal.toLocaleString()}` : "RD$ 0";
            document.getElementById('cantidadVentas').innerText = filas.length;
            document.getElementById('promedioVenta').innerText = tipo === "ventas" && filas.length ? `RD$ ${(sumaTotal / filas.length).toFixed(2)}` : "RD$ 0";
            estado.innerText = `${filas.length} resultado(s). Consulta ejecutada al presionar Enter.`;
        } catch (error) {
            console.error("Error en consulta:", error);
            estado.innerText = "No se pudo realizar la consulta. Revisa permisos y conexión.";
            tabla.innerHTML = "<tr><td colspan='3'>Error al consultar.</td></tr>";
        }
    };

    document.getElementById("btnConsultar").addEventListener("click", ejecutarConsulta);
    document.getElementById("textoConsulta").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            event.preventDefault();
            ejecutarConsulta();
        }
    });

    onAuthStateChanged(auth, async user => {
        if (!user) return window.location.href = 'index.html';
        const token = await user.getIdTokenResult();
        const rol = token.claims.rol;
        accesoPermitido = ['Administrador', 'Jefe', 'Consultor', 'Contador'].includes(rol);
        if (!accesoPermitido) document.getElementById('estadoConsulta').innerText = 'Tu rol no tiene acceso a reportes.';
    });
</script>
</body>
</html>
