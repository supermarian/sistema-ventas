<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súper Marian - Catálogo</title>
<style>
:root{--blue:#1769aa;--green:#218739;--ink:#203040;--bg:#eef4f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}header{background:#123b52;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px}header h1{margin:0;font-size:1.4rem}.shell{max-width:1180px;margin:26px auto;padding:0 18px}.auth,.catalogo,.pedido{background:#fff;border-radius:10px;padding:22px;box-shadow:0 6px 18px #123b5218}.auth{max-width:460px;margin:50px auto}.auth h2{margin-top:0;color:var(--blue)}input,button{font:inherit}input{width:100%;padding:11px;border:1px solid #cbd5db;border-radius:6px;margin:6px 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:6px;padding:10px 15px;cursor:pointer;font-weight:bold}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.muted{color:#60727c;font-size:.9rem}.hidden{display:none!important}.layout{display:grid;grid-template-columns:1fr 330px;gap:20px}.toolbar{display:flex;gap:8px;margin-bottom:16px}.toolbar input{margin:0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.product{border:1px solid #dce5e9;padding:14px;border-radius:8px}.product h3{margin:0 0 8px}.price{color:var(--green);font-weight:bold;font-size:1.1rem}.product button{width:100%;margin-top:12px}.cart-line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #e5eaed;padding:10px 0}.cart-line button{padding:3px 8px}.total{font-size:1.35rem;font-weight:bold;text-align:right;margin-top:16px}.notice{padding:10px;background:#edf6ec;border-left:4px solid var(--green);margin-top:12px}.error{color:#b42318;min-height:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><h1>🛒 Súper Marian | Catálogo para clientes</h1><button id="salir" class="btn" style="display:none">Salir</button></header>
<main class="shell">
<section id="authPanel" class="auth">
<h2>Acceso de cliente</h2><p class="muted">Consulta productos y envía tu pedido como cotización. Este acceso no abre el panel de empleados.</p>
<input id="email" type="email" placeholder="Correo electrónico" autocomplete="email"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
<div class="actions"><button id="entrar" class="btn primary">Entrar</button><button id="crearCuenta" class="btn green">Crear cuenta</button></div><p id="authEstado" class="error"></p>
</section>
<section id="catalogoPanel" class="hidden"><div class="layout"><section class="catalogo"><h2>Catálogo</h2><div class="toolbar"><input id="buscarProducto" type="search" placeholder="Escribe y presiona Enter para buscar..."><button id="consultar" class="btn primary">Buscar</button></div><p id="catalogoEstado" class="muted">Presiona Enter o Buscar para consultar el catálogo.</p><div id="productos" class="products"></div></section><aside class="pedido"><h2>Mi cotización</h2><div id="carrito"></div><div id="total" class="total">RD$ 0.00</div><input id="telefono" type="tel" placeholder="Teléfono"><input id="nombre" type="text" placeholder="Nombre completo"><input id="direccion" type="text" placeholder="Dirección de entrega"><button id="enviar" class="btn green" style="width:100%">Enviar cotización</button><p id="pedidoEstado" class="notice"></p></aside></div></section>
</main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';import{getFirestore,collection,getDocs,addDoc,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const config={apiKey:'AIzaSyAy4En1r4frEc6a4FGLf0vupJ0AY',authDomain:'supermercado-marian.firebaseapp.com',projectId:'supermercado-marian',storageBucket:'supermercado-marian.firebasestorage.app',messagingSenderId:'627337795444',appId:'1:627337795444:web:e9a4cb48ff164b78477e21'};const app=initializeApp(config);const auth=getAuth(app);const db=getFirestore(app);let productos=[],carrito=[];
const $=id=>document.getElementById(id);const money=value=>`RD$ ${Number(value||0).toLocaleString('es-DO',{minimumFractionDigits:2})}`;const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function cargarCatalogo(){ $('catalogoEstado').innerText='Consultando catálogo...';const snap=await getDocs(collection(db,'productos'));productos=snap.docs.map(item=>({id:item.id,...item.data()})).filter(item=>item.estatus!=='INACTIVO');renderProductos();$('catalogoEstado').innerText=`${productos.length} producto(s) disponible(s).`}
function renderProductos(){const term=$('buscarProducto').value.trim().toLowerCase();const lista=productos.filter(p=>!term||String(p.nombre||'').toLowerCase().includes(term)||String(p.codigo||'').toLowerCase().includes(term));$('productos').innerHTML=lista.map(p=>`<article class="product"><h3>${esc(p.nombre)}</h3><div class="price">${money(p.precio)}</div><small>${esc(p.codigo||'Sin código')}</small><button class="btn primary" data-id="${esc(p.id)}">Agregar</button></article>`).join('')||'<p>No hay productos para esa búsqueda.</p>';$('productos').querySelectorAll('button').forEach(button=>button.onclick=()=>agregar(button.dataset.id))}
function agregar(id){const p=productos.find(item=>item.id===id);if(!p)return;const actual=carrito.find(item=>item.id===id);if(actual)actual.cantidad++;else carrito.push({id:p.id,nombre:p.nombre,precio:Number(p.precio)||0,cantidad:1,subtotal:Number(p.precio)||0});renderCarrito()}
function renderCarrito(){$('carrito').innerHTML=carrito.map((p,i)=>`<div class="cart-line"><span>${esc(p.nombre)} x ${p.cantidad}</span><span>${money(p.subtotal)} <button class="btn" data-index="${i}">-</button></span></div>`).join('')||'<p class="muted">Aún no has agregado productos.</p>';$('carrito').querySelectorAll('button').forEach(button=>button.onclick=()=>{const item=carrito[button.dataset.index];item.cantidad--;if(item.cantidad<=0)carrito.splice(button.dataset.index,1);else item.subtotal=item.cantidad*item.precio;renderCarrito()});$('total').innerText=money(carrito.reduce((sum,p)=>sum+p.subtotal,0))}
$('consultar').onclick=cargarCatalogo;$('buscarProducto').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();cargarCatalogo()}};$('entrar').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('authEstado').innerText=''}catch(error){$('authEstado').innerText='Correo o contraseña incorrectos.'}};$('crearCuenta').onclick=async()=>{try{const credential=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await setDoc(doc(db,'clientes_portal',credential.user.uid),{uid:credential.user.uid,email:credential.user.email,rol:'Cliente',fechaRegistro:serverTimestamp()},{merge:true});$('authEstado').innerText='Cuenta creada correctamente.'}catch(error){$('authEstado').innerText=error.code==='auth/invalid-email'?'Correo inválido.':'No se pudo crear la cuenta.'}};$('salir').onclick=()=>signOut(auth);
$('enviar').onclick=async()=>{if(!carrito.length)return $('pedidoEstado').innerText='Agrega al menos un producto.';if(!$('nombre').value.trim()||!$('telefono').value.trim())return $('pedidoEstado').innerText='Completa nombre y teléfono.';try{const ref=await addDoc(collection(db,'cotizaciones'),{uidCliente:auth.currentUser.uid,emailCliente:auth.currentUser.email,nombre:$('nombre').value.trim(),telefono:$('telefono').value.trim(),direccion:$('direccion').value.trim(),items:carrito,total:carrito.reduce((sum,p)=>sum+p.subtotal,0),estado:'PENDIENTE',fecha:serverTimestamp()});carrito=[];renderCarrito();$('pedidoEstado').innerText=`Cotización enviada: ${ref.id}`;}catch(error){console.error(error);$('pedidoEstado').innerText='No se pudo enviar la cotización.'}};
onAuthStateChanged(auth,user=>{if(user){$('authPanel').classList.add('hidden');$('catalogoPanel').classList.remove('hidden');$('salir').style.display='block';cargarCatalogo();}else{$('authPanel').classList.remove('hidden');$('catalogoPanel').classList.add('hidden');$('salir').style.display='none'}});renderCarrito();
</script></body></html>
