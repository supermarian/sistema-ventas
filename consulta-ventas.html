<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de ventas - Súper Marian</title>
    <style>
        :root { --azul:#0b74de; --tinta:#172b4d; --linea:#d8e1ec; --fondo:#f4f7fb; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--fondo); color:var(--tinta); font-family:Segoe UI,Arial,sans-serif; }
        header { background:var(--azul); color:white; padding:16px 22px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
        header h1 { margin:0; font-size:1.35rem; }
        header a { color:white; text-decoration:none; background:#0758aa; padding:9px 12px; border-radius:6px; }
        main { max-width:1280px; margin:20px auto; padding:0 16px 40px; }
        .panel { background:white; border:1px solid var(--linea); border-radius:8px; padding:16px; margin-bottom:16px; box-shadow:0 3px 12px rgba(23,43,77,.06); }
        .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; align-items:end; }
        label { display:flex; flex-direction:column; gap:5px; font-size:.8rem; font-weight:700; }
        input, select, button { min-height:38px; border:1px solid #b9c7d8; border-radius:5px; padding:8px; font:inherit; }
        button { cursor:pointer; background:var(--azul); color:white; border:0; font-weight:700; }
        button.secondary { background:#526579; }
        .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:14px; }
        .metric { background:#f4f8fd; border-left:4px solid var(--azul); padding:10px; }
        .metric small { display:block; color:#64748b; }
        .metric strong { font-size:1.15rem; }
        .table-wrap { overflow:auto; }
        table { width:100%; border-collapse:collapse; min-width:850px; }
        th, td { padding:9px 10px; border-bottom:1px solid #e7edf4; text-align:left; white-space:nowrap; }
        th { background:#edf4fc; color:#174a82; }
        tbody tr:hover { background:#f6faff; }
        .detail-title { display:flex; justify-content:space-between; align-items:center; gap:12px; }
        .muted { color:#64748b; }
        .badge { display:inline-block; padding:4px 7px; border-radius:4px; background:#e8f0fe; font-size:.78rem; }
        @media (max-width:650px) { header { align-items:flex-start; flex-direction:column; } main { padding:0 9px 30px; } }
    </style>
</head>
<body>
<header><h1>🧾 Consulta de ventas</h1><a href="menu.html">Volver al menú</a></header>
<main>
    <section class="panel">
        <div class="filters">
            <label>Desde<input id="desde" type="date"></label>
            <label>Hasta<input id="hasta" type="date"></label>
            <label>Tipo<select id="tipo"><option value="TODAS">Todas</option><option value="CONTADO">Contado</option><option value="CREDITO">Crédito</option></select></label>
            <label>Buscar factura, cliente o cajero<input id="buscar" type="search" placeholder="Texto de búsqueda"></label>
            <button id="aplicar">Consultar</button>
        </div>
        <div id="estado" class="muted" style="margin-top:10px">Cargando ventas...</div>
        <div class="summary">
            <div class="metric"><small>Facturas</small><strong id="totalFacturas">0</strong></div>
            <div class="metric"><small>Contado</small><strong id="totalContado">RD$ 0.00</strong></div>
            <div class="metric"><small>Crédito</small><strong id="totalCredito">RD$ 0.00</strong></div>
            <div class="metric"><small>Total bruto</small><strong id="totalGeneral">RD$ 0.00</strong></div>
        </div>
    </section>
    <section class="panel table-wrap">
        <table><thead><tr><th>Fecha</th><th>Cliente</th><th>Factura</th><th>Tipo</th><th>Subtotal</th><th>ITBIS</th><th>Total bruto</th><th>Estado</th><th>Hora</th><th></th></tr></thead><tbody id="ventasBody"></tbody></table>
    </section>
    <section class="panel" id="detallePanel" hidden>
        <div class="detail-title"><div><h2 id="detalleTitulo" style="margin:0">Detalle de factura</h2><p id="detalleMeta" class="muted"></p></div><button class="secondary" id="cerrarDetalle">Cerrar</button></div>
        <div class="table-wrap"><table><thead><tr><th>Orden</th><th>Código</th><th>Presentación</th><th>Nombre</th><th>Cantidad</th><th>Factor base</th><th>Precio unitario</th><th>Total</th></tr></thead><tbody id="detalleBody"></tbody></table></div>
    </section>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyAy4En1r4frGng-tWFtA68FGLf0vupJ0AY',authDomain:'supermercado-marian.firebaseapp.com',projectId:'supermercado-marian',storageBucket:'supermercado-marian.firebasestorage.app',messagingSenderId:'627337795444',appId:'1:627337795444:web:e9a4cb48ff164b78477e21'});
const auth=getAuth(app),db=getFirestore(app);let ventas=[];
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));const money=value=>`RD$ ${Number(value||0).toLocaleString('es-DO',{minimumFractionDigits:2})}`;const fecha=valor=>{if(!valor)return null;if(typeof valor.toDate==='function')return valor.toDate();const date=new Date(valor);return Number.isNaN(date.getTime())?null:date};
const tipoVenta=venta=>String(venta.metodoPago||'').toLowerCase().includes('crédito')||String(venta.metodoPago||'').toLowerCase().includes('credito')||venta.nroCredito?'CREDITO':'CONTADO';
const fechaInicial=new Date();fechaInicial.setHours(0,0,0,0);$('desde').value=fechaInicial.toISOString().slice(0,10);$('hasta').value=fechaInicial.toISOString().slice(0,10);
const cargar=async()=>{const snap=await getDocs(collection(db,'ventas_realizadas'));ventas=snap.docs.map(item=>({id:item.id,...item.data()}));render();};
const ventasFiltradas=()=>{const desde=new Date(`${$('desde').value}T00:00:00`);const hasta=new Date(`${$('hasta').value}T23:59:59.999`);const term=$('buscar').value.trim().toLowerCase();return ventas.filter(venta=>{const date=fecha(venta.fecha);if(date&&(date<desde||date>hasta))return false;const tipo=tipoVenta(venta);if($('tipo').value!=='TODAS'&&tipo!==$('tipo').value)return false;return !term||[venta.nroFactura,venta.cliente,venta.cajero,venta.emailCliente].some(value=>String(value||'').toLowerCase().includes(term));}).sort((a,b)=>(fecha(b.fecha)?.getTime()||0)-(fecha(a.fecha)?.getTime()||0));};
const render=()=>{const lista=ventasFiltradas();let contado=0,credito=0,general=0;$('ventasBody').innerHTML=lista.map(venta=>{const total=Number(venta.total||0);const tipo=tipoVenta(venta);general+=total;if(tipo==='CREDITO')credito+=total;else contado+=total;const date=fecha(venta.fecha);const items=Array.isArray(venta.items)?venta.items:[];const subtotal=items.reduce((sum,item)=>sum+Number(item.subtotal||0),0);const itbis=items.reduce((sum,item)=>sum+Number(item.itbis||0),0);return `<tr><td>${esc(date?.toLocaleDateString()||'---')}</td><td>${esc(venta.cliente||'Consumidor Final')}</td><td>${esc(venta.nroFactura||venta.id)}</td><td><span class="badge">${esc(tipo)}</span></td><td>${money(subtotal-itbis)}</td><td>${money(itbis)}</td><td>${money(total)}</td><td>${esc(venta.estado||'REGISTRADA')}</td><td>${esc(date?.toLocaleTimeString()||'---')}</td><td><button data-detalle="${esc(venta.id)}">Ver detalle</button></td></tr>`;}).join('')||'<tr><td colspan="10">No hay ventas para los filtros seleccionados.</td></tr>';$('totalFacturas').textContent=lista.length;$('totalContado').textContent=money(contado);$('totalCredito').textContent=money(credito);$('totalGeneral').textContent=money(general);document.querySelectorAll('[data-detalle]').forEach(button=>button.onclick=()=>mostrarDetalle(lista.find(venta=>venta.id===button.dataset.detalle)));$('estado').textContent=`${lista.length} venta(s) encontradas.`;};
const mostrarDetalle=venta=>{if(!venta)return;const items=Array.isArray(venta.items)?venta.items:[];$('detalleTitulo').textContent=`Detalle ${venta.nroFactura||venta.id}`;$('detalleMeta').textContent=`${venta.cliente||'Consumidor Final'} · ${tipoVenta(venta)} · ${fecha(venta.fecha)?.toLocaleString()||'---'}`;$('detalleBody').innerHTML=items.map((item,indice)=>`<tr><td>${indice+1}</td><td>${esc(item.codigo||'S/C')}</td><td>${esc(item.presentacionNombre||item.unidad||'Und')}</td><td>${esc(item.nombre||item.descripcion||'Producto')}</td><td>${esc(item.cantidad||0)}</td><td>${esc(item.factorConversion||1)}</td><td>${money(item.precio)}</td><td>${money(item.subtotal)}</td></tr>`).join('')||'<tr><td colspan="8">La factura no tiene líneas guardadas.</td></tr>';$('detallePanel').hidden=false;$('detallePanel').scrollIntoView({behavior:'smooth'});};
$('aplicar').onclick=render;$('buscar').oninput=render;$('tipo').onchange=render;$('cerrarDetalle').onclick=()=>{$('detallePanel').hidden=true};onAuthStateChanged(auth,user=>{if(!user)return location.href='index.html';cargar().catch(error=>{$('estado').textContent='No se pudieron cargar las ventas.';console.error(error);});});
</script>
</body>
</html>
